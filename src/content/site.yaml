work:
  # PLACEHOLDER: not approved yet. No employer, product or client is named, and no team size.
  summary: 'PLACEHOLDER: I lead the engineering team behind a portfolio accounting platform for crypto and traditional assets. Most of what I solve there is scheduling: what runs next, on which worker, and what happens when that worker dies.'
  # Scheduling problems, each with the answer I used.
  problems:
    - problem: 'Reshape a very large table while it takes writes.'
      answer: 'Write to both shapes. Backfill the oldest year first. Make every write an idempotent upsert. Move the reads last.'
    - problem: 'Keep one long backfill from starving everything else.'
      answer: 'Give it a queue of its own. Scale the workers on backlog per pod, not on queue length.'
    - problem: 'Stop two workers doing the same job.'
      answer: 'A lock that does not block. The second request records itself and leaves; the first one picks it up.'
    - problem: 'Survive a worker that dies halfway.'
      answer: 'Heartbeat leases and resumable chunks. The next worker starts from the last checkpoint.'
  # Questions, not figures. No numbers from work are published.
  questions:
    - 'What runs next?'
    - 'Who holds the lock when the holder is dead?'
    - 'Is it finished, or did it only stop?'
    - 'Can it run twice and still be right?'
    - 'What does it cost to be exactly correct?'
    - 'Does it still work at a thousand times the size?'
  focus:
    - Distributed systems
    - PostgreSQL internals
    - Queues and autoscaled workers
    - Ledgers, tax lots, cost basis
    - Reconciliation
    - On-chain and exchange data
    - LLM tools over MCP
  explainNote: 'Seq Scan on consulting, Index Scan on fintech'
