# Featured repos, in display order. Only public repos ship.
# `blurb` overrides the GitHub description. `owner` defaults to site.yaml `github`.
# `private: true` shows a repo that is not public: no link, no GitHub lookup; give `language` by hand.

projects:
  - repo: doodle-games
    title: Doodle Snakes & Ladders
    blurb: 'Board games drawn like crayon doodles. Local and online play.'
    url: https://games.shirishve.com
  - repo: mimir-flix
    title: mimir-flix
    blurb: 'A home media front end for Jellyfin: the library, streaming apps, live TV and the TV itself, from the phone.'
  - repo: mimir-climate
    title: mimir-climate
    blurb: 'The home thermostats for an assistant: an MCP server that reads them and changes their schedules when asked.'
  - repo: mimir-claw
    title: mimir-claw
    blurb: 'The home assistant setup: skills, MCP servers, privacy limits and automations, so a new Mac comes up from one repo.'
  - repo: mimir-finance
    title: mimir-finance
    blurb: 'Local-first personal finance tools: reconciliation and encrypted backups for a self-hosted portfolio tracker.'
    private: true
    language: TypeScript
